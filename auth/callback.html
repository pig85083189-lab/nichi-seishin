<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日精進 — 完成登入</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <style>
      body {
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        margin: 2rem auto;
        max-width: 36rem;
        padding: 0 1.25rem;
        color: #4a4038;
        background: #f5efe6;
        line-height: 1.6;
      }
      #actions {
        margin-top: 1rem;
      }
      #actions a {
        display: inline-block;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        background: #9c8879;
        color: #fff;
        text-decoration: none;
      }
      #debug {
        white-space: pre-wrap;
        font-size: 12px;
        color: #6b5e4e;
      }
    </style>
  </head>
  <body>
    <p id="status">正在完成 Google 登入…</p>
    <p id="actions" hidden><a id="retry" href="/">回到首頁重新登入</a></p>
    <pre id="debug"></pre>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
    <script src="pkce-storage.js?v=2"></script>
    <script>
      (async function () {
        var home = (location.origin || "https://nichi-seishin.vercel.app") + "/";
        var statusEl = document.getElementById("status");
        var debugEl = document.getElementById("debug");
        var actionsEl = document.getElementById("actions");
        var retryEl = document.getElementById("retry");
        var AUTH_ERROR_KEY = "nichi.authError";
        var storageApi = window.NichiAuthStorage;

        function note(text) {
          if (debugEl) debugEl.textContent = String(text || "");
        }

        function friendly(reason) {
          var message = String(reason || "Google 登入失敗");
          if (/PKCE verifier not found|Auth session missing|code verifier/i.test(message)) {
            return "登入驗證已過期，瀏覽器找不到 PKCE 驗證碼。請回到首頁再點一次「使用 Google 帳號登入」，並避免用無痕視窗或不同瀏覽器開啟連結。";
          }
          if (/invalid request|both auth code and code verifier/i.test(message)) {
            return "登入驗證碼不完整。請回到首頁重新登入。";
          }
          if (/expired|invalid_grant/i.test(message)) {
            return "授權碼已過期或已使用過。請回到首頁重新登入。";
          }
          return message;
        }

        function clearStaleAuth() {
          if (storageApi && storageApi.clearAuthArtifacts) {
            storageApi.clearAuthArtifacts({ keepSession: false });
          }
        }

        function fail(reason) {
          var message = friendly(reason);
          clearStaleAuth();
          try {
            sessionStorage.setItem(AUTH_ERROR_KEY, message);
          } catch (e) {
            /* ignore */
          }
          if (statusEl) statusEl.textContent = "登入失敗：" + message;
          if (retryEl) retryEl.href = home + "?auth=error&reason=" + encodeURIComponent(message.slice(0, 180));
          if (actionsEl) actionsEl.hidden = false;
          note(location.href);
          window.setTimeout(function () {
            location.replace(home + "?auth=error&reason=" + encodeURIComponent(message.slice(0, 180)));
          }, 5000);
        }

        function query() {
          var search = new URLSearchParams(location.search);
          var hash = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
          hash.forEach(function (value, key) {
            if (!search.get(key)) search.set(key, value);
          });
          return search;
        }

        try {
          var params = query();
          var oauthError = params.get("error_description") || params.get("error");
          if (oauthError) {
            fail(oauthError);
            return;
          }

          var code = params.get("code") || "";
          if (!code) {
            fail("回調網址缺少授權碼。請再點一次「使用 Google 帳號登入」。");
            return;
          }
          if (code.indexOf("4/") === 0) {
            fail(
              "Google 把授權碼送到了網站，而不是 Supabase。請到 Google Cloud → 憑證 → 授權重新導向 URI，改成唯一這一列：https://zmjfbdtwxuawebwnybfp.supabase.co/auth/v1/callback"
            );
            return;
          }

          if (storageApi && storageApi.persistVerifierCopies) {
            storageApi.persistVerifierCopies();
          }

          var cfgRes = await fetch("/api/config");
          var cfg = await cfgRes.json();
          if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
            fail("尚未設定 Supabase");
            return;
          }

          var createClient =
            window.supabase.createClient ||
            (window.supabase.default && window.supabase.default.createClient);
          var authStorage = storageApi && storageApi.createAuthStorage ? storageApi.createAuthStorage() : undefined;
          var client = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: false,
              flowType: "pkce",
              storageKey: (storageApi && storageApi.STORAGE_KEY) || "nichi-auth",
              ...(authStorage ? { storage: authStorage } : {}),
            },
          });
          if (client.auth.initialize) await client.auth.initialize();

          if (!storageApi || !storageApi.readVerifier || !storageApi.readVerifier()) {
            note("verifier missing before exchange; still trying");
          }

          var exchanged = await client.auth.exchangeCodeForSession(code);
          if (exchanged.error) {
            fail(exchanged.error.message || "授權碼交換失敗");
            return;
          }

          var sessionRes = await client.auth.getSession();
          var session = sessionRes.data && sessionRes.data.session;
          if (!session && exchanged.data && exchanged.data.session) session = exchanged.data.session;
          if (session) {
            if (storageApi && storageApi.persistSessionBackup) {
              storageApi.persistSessionBackup({
                access_token: session.access_token || "",
                refresh_token: session.refresh_token || "",
                expires_at: session.expires_at || 0,
                expires_in: session.expires_in || 0,
                token_type: session.token_type || "bearer",
                user: session.user || null,
              });
            }
            location.replace(home + "?auth=ok");
            return;
          }
          fail("沒有取得登入工作階段，請再試一次");
        } catch (error) {
          fail(error && error.message ? error.message : "Google 登入失敗");
        }
      })();
    </script>
  </body>
</html>
